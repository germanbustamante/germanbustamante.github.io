<text x="745.0" y="362.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52525B" text-anchor="middle">one UIImage per content · appearance · text size</text>
