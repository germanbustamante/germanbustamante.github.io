<text x="355.0" y="178.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#18181B" text-anchor="middle">MapAnnotationDiff</text>
