<text x="15" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#15803D" text-anchor="start" font-style="italic">200 stations showing 12 different things: 12 images, one bitmap layer per pin</text>
